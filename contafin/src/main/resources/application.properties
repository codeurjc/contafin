#Varables para la configuración de la base de datos
#URL de la base de datos (Dentro del contenedor docker)
spring.datasource.url=jdbc:mysql://${DATABASE_HOST}:3306/test?autoReconnect=true&useSSL=false
#Nombre y contraseña usuario BBDD
spring.datasource.username=root
spring.datasource.password=pass
#Driver de la base de datos
spring.datasource.driverClassName=com.mysql.jdbc.Driver
#La BBDD se mantiene(con los datos de la ultima ejecucion) y solo se actualiza
spring.jpa.hibernate.ddl-auto=create-drop
#El correo se escribe con codificación UTF-8
spring.mail.default-encoding=UTF-8
#Se indican proveedor, puerto del cual se envian los correos, dirección de correo, contraseña, protocolo
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=contafinv2@gmail.com
spring.mail.password=mecd wbcl jkce jpqf
spring.mail.protocol=smtp
spring.mail.test-connection=false
#Se indica que es obligatoria la autenticación y el uso de TLS
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
#Se indica donde se guardan los certificados para los entornos de prueba, su contraseña y el tipo de cifrado
server.ssl.key-store = classpath:keystore.jks
server.ssl.key-store-password =password
server.ssl.key-password =secret
#Se indica que la cantidad maxima de peso para ficheros subidos es de 10MB
spring.http.multipart.max-file-size=10MB
spring.http.multipart.max-request-size=10MB
