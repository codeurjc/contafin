version: "3.9"

services:
   java_db:
    container_name: java_db
    image: mysql:5.7
    ports:
      - 3306:3306
    environment:
      - MYSQL_ROOT_PASSWORD=pass
      - MYSQL_DATABASE=test
      - MYSQL_ROOT_HOST=%
  #new app (angular_app)
  angular_app:
    container_name: angular_app
    image: pee-angular_app:1.0.0
    build: ../AngularContafin
    ports:
      - 4200:4200
    depends_on:
      - java_app
  java_app:
    container_name: java_app
    image: contafin/contafin:latest
    build: .
    ports:
      - 8080:8080
    environment:
      - DATABASE_HOST=java_db
    depends_on:
      - java_db
  